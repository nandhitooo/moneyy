name: catatan_keuangan
description: Aplikasi pencatatan keuangan pribadi dengan Flutter dan Firebase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.3.0
  cloud_firestore: ^5.4.4
  intl: ">=0.19.0 <1.0.0"
  fl_chart: ^0.69.0
  device_preview: ^1.2.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
